[package]
name = "ai-router"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Local-first, cost-aware model routing for AI coding CLIs"
repository = "https://github.com/alphaonedev/ai-router"

[features]
default = []
paw = ["dep:paw-rs", "dep:tokio"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
toon-format = { version = "0.5", default-features = false }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", features = ["json"] }
paw-rs = { version = "0.3", optional = true, default-features = false, features = ["candle"] }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile = "3"
