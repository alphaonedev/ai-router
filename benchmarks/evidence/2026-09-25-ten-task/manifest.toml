use ai_router::{cache_key, Config, Request};
#[test]
fn regression() {
    let mut config: Config = toml::from_str(include_str!("../router.toml")).unwrap();
    let request = Request { client: "codex".into(), task: "fix a parser".into(), model: None, min_tier: None, high_stakes: false, offline: true };
