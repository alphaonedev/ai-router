id = "toon-shorter-only"
file = "src/main.rs"
prompt = "Fix the regression in src/main.rs: the toon command should keep the original JSON when the TOON encoding is longer. Run the Rust tests."
healthy = "if encoded.len() < raw.len() || *force {"
broken = "if encoded.len() > raw.len() || *force {"
test = '''
use std::{fs, process::Command};
#[test]
fn regression() {
    let dir = tempfile::tempdir().unwrap();
    let path = dir.path().join("input.json");
    fs::write(&path, "[]").unwrap();
    let output = Command::new(env!("CARGO_BIN_EXE_ai-router")).args(["toon", "--input", path.to_str().unwrap()]).output().unwrap();
    assert!(output.status.success());
    assert_eq!(String::from_utf8_lossy(&output.stdout), "[]");
}
'''
