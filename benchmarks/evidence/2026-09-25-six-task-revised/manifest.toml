[[tasks]]
id = "cache-policy-version"
file = "src/lib.rs"
prompt = "Fix the regression in src/lib.rs: changing policy_version must change the routing cache key. Run the Rust tests."
healthy = "        cfg.policy_version,\n        req.client,"
broken = "        0,\n        req.client,"
test = '''
use ai_router::{cache_key, Config, Request};
#[test]
fn regression() {
    let mut config: Config = toml::from_str(include_str!("../router.toml")).unwrap();
    let request = Request { client: "codex".into(), task: "fix a parser".into(), model: None, min_tier: None, high_stakes: false, offline: true };
    let before = cache_key(&request, &config);
    config.policy_version += 1;
    assert_ne!(before, cache_key(&request, &config));
}
'''

