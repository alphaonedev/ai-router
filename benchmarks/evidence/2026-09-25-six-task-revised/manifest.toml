[[tasks]]
id = "savings-boundary"
file = "src/lib.rs"
prompt = "Fix the regression in src/lib.rs: exactly 50% compute regain with equal quality must meet the savings target. Run the Rust tests."
healthy = "regain_fraction >= 0.5 && routed_failures <= baseline_failures"
broken = "regain_fraction > 0.5 && routed_failures <= baseline_failures"
test = '''
use ai_router::{savings, Measurement};
#[test]
fn regression() {
    let report = savings(&[Measurement { baseline_compute: 100.0, routed_compute: 50.0, baseline_success: true, routed_success: true }]).unwrap();
    assert!(report.target_met);
}
'''

