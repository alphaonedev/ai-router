policy_version = 4
default = "balanced"

[fusion]
min_tier = "deep"
max_corrections = 1
max_handoff_chars = 6000
timeout_secs = 900

[[fusion.validation]]
program = "cargo"
args = ["test", "-q"]

[[fusion.validation]]
program = "cargo"
args = ["clippy", "-q", "--all-targets", "--", "-D", "warnings"]

[fusion.lead]
client = "codex"
model = "gpt-6-astra"

[fusion.sidekick]
client = "codex"
model = "gpt-5.6-sol"

[fusion.routine]
client = "claude"
model = "haiku"

[jev]
enabled = false
min_confidence = 0.75

[paw]
enabled = false
slug = ""
local_dir = ""

[decision_service]
name = "clm"
enabled = false
base_url = "http://127.0.0.1:8700"
model = "clm-latest"
path = "/v1/systemone"
min_margin = 0.2

[openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[patch]
enabled = true
model = "google/gemini-3.5-flash-lite"
max_file_bytes = 100000

[[models.claude]]
id = "haiku"
tier = "fast"
effort = "low"
description = "Low cost Claude model for routine tasks"

[[models.claude]]
id = "sonnet"
tier = "balanced"
effort = "medium"
description = "General Claude coding model"

[[models.claude]]
id = "opus"
tier = "deep"
effort = "high"
description = "Strong Claude reasoning model"

[[models.codex]]
id = "gpt-6-luna"
tier = "fast"
effort = "low"
description = "Fast Codex task model"

[[models.codex]]
id = "gpt-5.6-sol"
tier = "balanced"
effort = "medium"
description = "General Codex coding model"

[[models.codex]]
id = "gpt-6-astra"
tier = "deep"
effort = "high"
description = "High reasoning Codex model"

[[models.grok]]
id = "grok-4.7-build-fast"
tier = "fast"
description = "Fast Grok coding model"

[[models.grok]]
id = "grok-4.7"
tier = "balanced"
description = "General Grok model"

[[models.grok]]
id = "grok-4.7"
tier = "deep"
effort = "high"
description = "Grok with high reasoning effort"

[[models.openrouter]]
id = "google/gemini-3.5-flash-lite"
tier = "fast"
description = "Low cost API model"

[[models.openrouter]]
